<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Ilberiz Techz | ICSE Class 10 Notes & DPPs</title>
    <meta name="description" content="ICSE Class 10 chapter-wise class notes and interactive PYQ DPPs for Physics, Chemistry, Biology, History, Geography, English and more.">
    <meta name="theme-color" content="#0F1216" id="meta-theme-color">
    <meta name="color-scheme" content="dark light">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Ilberiz Techz">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=14.8">

    <!-- Pre-paint guard: unlock state + theme before first paint (no flicker) -->
    <script>
        (function () {
            var d = document.documentElement;
            try {
                var auth = sessionStorage.getItem('ilberiz_auth') || localStorage.getItem('ilberiz_auth');
                if (auth === 'granted' || auth === '11223344') d.classList.add('is-authenticated');
            } catch (e) {}
            var pref = 'dark', accent = 'yellow';
            try {
                pref = localStorage.getItem('ilberiz_theme') || 'dark';
                accent = localStorage.getItem('ilberiz_accent') || 'yellow';
            } catch (e) {}
            if (pref !== 'light' && pref !== 'system') pref = 'dark';
            var mode = pref === 'system'
                ? (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
                : pref;
            d.setAttribute('data-theme', mode);
            d.setAttribute('data-accent', accent);
            var m = document.getElementById('meta-theme-color');
            if (m) m.setAttribute('content', mode === 'light' ? '#F3F4F6' : '#0F1216');
        })();
    </script>
</head>
<body>
    <!-- Passcode lock screen -->
    <div class="lock" id="auth-gate" role="dialog" aria-modal="true" aria-labelledby="lock-title">
        <div class="lock-card">
            <svg class="brand-mark lock-mark" viewBox="0 0 100 100" aria-hidden="true">
                <rect width="100" height="100" rx="24" class="bm-bg"/>
                <path d="M28 34H72" class="bm-line"/>
                <path d="M26 51H76" class="bm-hl"/>
                <path d="M28 68H56" class="bm-line bm-dim"/>
            </svg>
            <h1 class="lock-title" id="lock-title">Ilberiz Techz</h1>
            <p class="lock-sub">ICSE Class 10 notes and DPPs. Enter the passcode to continue.</p>

            <form class="lock-form" id="auth-form" autocomplete="off" novalidate>
                <label class="sr-only" for="auth-password-input">Passcode</label>
                <div class="lock-field" id="auth-input-group">
                    <span class="ms" aria-hidden="true">key</span>
                    <input type="password" id="auth-password-input" inputmode="numeric" autocomplete="current-password"
                           placeholder="Passcode" enterkeyhint="go" spellcheck="false">
                    <button type="button" class="icon-btn" id="auth-toggle-visibility" aria-label="Show passcode">
                        <span class="ms" id="auth-eye-icon">visibility</span>
                    </button>
                </div>
                <label class="check">
                    <input type="checkbox" id="auth-remember-checkbox" checked>
                    <span class="check-box" aria-hidden="true"></span>
                    <span>Remember this device</span>
                </label>
                <p class="lock-error" id="auth-error-msg" role="alert" aria-live="assertive"></p>
                <button type="submit" class="btn btn-primary btn-block btn-lg" id="auth-submit-btn">
                    <span class="ms">lock_open</span><span>Unlock</span>
                </button>
            </form>
            <a class="lock-help" href="https://t.me/ilberiztechziitkanpur" target="_blank" rel="noopener noreferrer">
                <span class="ms">send</span> Ask for the passcode on Telegram
            </a>
        </div>
    </div>

    <div class="app" id="app">
        <!-- Laptop sidebar -->
        <aside class="sidebar" id="sidebar" aria-label="Main navigation">
            <a class="side-brand" href="#/" aria-label="Ilberiz Techz home">
                <svg class="brand-mark" viewBox="0 0 100 100" aria-hidden="true">
                    <rect width="100" height="100" rx="24" class="bm-bg"/>
                    <path d="M28 34H72" class="bm-line"/>
                    <path d="M26 51H76" class="bm-hl"/>
                    <path d="M28 68H56" class="bm-line bm-dim"/>
                </svg>
                <span class="side-brand-text">
                    <strong>Ilberiz Techz</strong>
                    <small>ICSE Class 10</small>
                </span>
            </a>
            <nav class="side-nav" id="side-nav"></nav>
            <div class="side-foot">
                <a class="side-link" href="https://t.me/ilberiztechziitkanpur" target="_blank" rel="noopener noreferrer">
                    <span class="ms">send</span><span>Telegram community</span>
                </a>
                <button type="button" class="side-link" data-action="settings">
                    <span class="ms">tune</span><span>Settings</span>
                </button>
                <button type="button" class="side-link" data-action="lock">
                    <span class="ms">lock</span><span>Lock website</span>
                </button>
            </div>
        </aside>

        <div class="main">
            <header class="topbar" id="topbar">
                <button type="button" class="icon-btn top-back" id="top-back" aria-label="Go back">
                    <span class="ms">arrow_back</span>
                </button>
                <a class="top-brand" id="top-brand" href="#/" aria-label="Ilberiz Techz home">
                    <svg class="brand-mark" viewBox="0 0 100 100" aria-hidden="true">
                        <rect width="100" height="100" rx="24" class="bm-bg"/>
                        <path d="M28 34H72" class="bm-line"/>
                        <path d="M26 51H76" class="bm-hl"/>
                        <path d="M28 68H56" class="bm-line bm-dim"/>
                    </svg>
                </a>
                <div class="top-title" id="top-title"></div>
                <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
                <div class="top-actions">
                    <button type="button" class="search-trigger" data-action="search" aria-label="Search notes, chapters and DPPs">
                        <span class="ms">search</span>
                        <span class="search-trigger-text">Search notes, chapters, DPPs</span>
                        <kbd>Ctrl K</kbd>
                    </button>
                    <button type="button" class="icon-btn" id="btn-theme" data-action="theme" aria-label="Switch to light mode">
                        <span class="ms">light_mode</span>
                    </button>
                    <button type="button" class="icon-btn" id="btn-sound" data-action="sound" aria-label="Mute sounds">
                        <span class="ms">volume_up</span>
                    </button>
                    <button type="button" class="icon-btn only-desktop" data-action="settings" aria-label="Settings">
                        <span class="ms">tune</span>
                    </button>
                </div>
            </header>

            <div class="offline-pill" id="offline-pill" hidden>
                <span class="ms">cloud_off</span> Offline — notes you opened before still work
            </div>

            <main class="view" id="view" tabindex="-1"></main>
        </div>

        <!-- Phone / tablet bottom tabs -->
        <nav class="tabbar" id="tabbar" aria-label="Main navigation">
            <a class="tab" href="#/" data-tab="home"><span class="ms">home</span><span>Home</span></a>
            <a class="tab" href="#/subjects" data-tab="subjects"><span class="ms">grid_view</span><span>Subjects</span></a>
            <button type="button" class="tab" data-tab="search" data-action="search"><span class="ms">search</span><span>Search</span></button>
            <a class="tab" href="#/library" data-tab="library"><span class="ms">bookmarks</span><span>Library</span></a>
            <button type="button" class="tab" data-tab="more" data-action="settings"><span class="ms">more_horiz</span><span>More</span></button>
        </nav>
    </div>

    <div id="overlay-root"></div>
    <div class="toasts" id="toasts" aria-live="polite" aria-atomic="true"></div>

    <script src="data.js?v=14.8" defer></script>
    <script src="script.js?v=14.8" defer></script>
</body>
</html>
