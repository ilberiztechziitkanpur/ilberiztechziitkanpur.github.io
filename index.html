<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ilberiz Techz | Class 10th Notes & Study Platform</title>
    <meta name="description" content="Class 10th comprehensive study notes, chapter-wise PDFs, and educational resources.">
    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <link rel="stylesheet" href="style.css?v=4.0">
    <!-- Instant Pre-paint Authentication Guard (Prevents visual flicker for verified users) -->
    <script>
        (function() {
            try {
                var auth = sessionStorage.getItem('ilberiz_auth') || localStorage.getItem('ilberiz_auth');
                if (auth === 'granted' || auth === '11223344') {
                    document.documentElement.classList.add('is-authenticated');
                }
            } catch (e) {}
        })();
    </script>
</head>
<body>
    <div class="background-mesh">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <!-- Frontend Password Authentication Gate -->
    <div class="auth-gate-wrapper" id="auth-gate" aria-modal="true" role="dialog" aria-labelledby="auth-gate-title">
        <div class="auth-card">
            <div class="auth-shield-wrap">
                <div class="auth-shield-halo"></div>
                <div class="auth-shield-icon">
                    <span class="material-symbols-outlined">lock</span>
                </div>
            </div>

            <div class="auth-badge">
                <span class="material-symbols-outlined">security</span>
                <span>Restricted Access Portal</span>
            </div>

            <h1 class="auth-title" id="auth-gate-title">Ilberiz <span class="text-gradient">Techz</span></h1>
            <p class="auth-subtitle">Class 10th ICSE Notes & Examination Engine. Enter the security passcode to unlock platform access.</p>

            <form class="auth-form" id="auth-form" autocomplete="off" onsubmit="return false;">
                <div class="auth-input-group" id="auth-input-group">
                    <span class="material-symbols-outlined input-icon">key</span>
                    <input 
                        type="password" 
                        id="auth-password-input" 
                        class="auth-input" 
                        placeholder="Enter access passcode..." 
                        autocomplete="current-password"
                        required
                        aria-label="Security Passcode"
                    />
                    <button type="button" class="auth-toggle-visibility" id="auth-toggle-visibility" title="Show or hide password" aria-label="Toggle password visibility">
                        <span class="material-symbols-outlined" id="auth-eye-icon">visibility</span>
                    </button>
                </div>

                <div class="auth-options">
                    <label class="auth-remember-label">
                        <input type="checkbox" id="auth-remember-checkbox" checked />
                        <span class="auth-checkbox-box"></span>
                        <span>Remember on this browser</span>
                    </label>
                </div>

                <div class="auth-error-msg" id="auth-error-msg" role="alert" aria-live="assertive"></div>

                <button type="submit" class="auth-submit-btn" id="auth-submit-btn">
                    <span class="material-symbols-outlined btn-icon">lock_open</span>
                    <span class="btn-text">Unlock Platform</span>
                </button>
            </form>

            <div class="auth-security-footer">
                <span class="material-symbols-outlined">verified_user</span>
                <span>Protected by Frontend Passcode Verification</span>
            </div>
        </div>
    </div>

    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <div class="app-container">
        <aside class="sidebar" id="sidebar">
            <div class="logo-area">
                <div class="logo-icon"><span class="material-symbols-outlined">school</span></div>
                <h2>Ilberiz Techz</h2>
            </div>
            
            <nav class="nav-menu" id="nav-menu">
                <!-- Navigation items will be injected here -->
            </nav>

            <div class="sidebar-footer">
                <a href="https://t.me/ilberiztechziitkanpur" target="_blank" rel="noopener noreferrer" class="telegram-link">
                    <span class="material-symbols-outlined">send</span> Join Telegram
                </a>
                <button type="button" class="sidebar-lock-btn" id="sidebar-lock-btn" title="Lock the website">
                    <span class="material-symbols-outlined">lock</span> Lock Website
                </button>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Toggle Navigation Menu">
                    <span class="material-symbols-outlined">menu</span>
                </button>
                <div class="breadcrumbs" id="breadcrumbs">
                    <!-- Breadcrumbs will be injected here -->
                </div>
                <div class="top-bar-right">
                    <div class="search-bar">
                        <span class="material-symbols-outlined">search</span>
                        <input type="text" id="search-input" placeholder="Search notes, chapters, topics..." autocomplete="off">
                        <button class="clear-search-btn hidden" id="clear-search-btn" aria-label="Clear search">
                            <span class="material-symbols-outlined">close</span>
                        </button>
                    </div>
                    <button type="button" class="topbar-lock-btn" id="topbar-lock-btn" title="Lock Website" aria-label="Lock Website">
                        <span class="material-symbols-outlined">lock</span>
                        <span class="topbar-lock-text">Lock</span>
                    </button>
                </div>
            </header>

            <div class="content-area" id="content-area">
                <!-- Main content cards or video player will go here -->
            </div>
        </main>
    </div>

    <script src="data.js?v=4.4"></script>
    <script src="script.js?v=4.4"></script>
</body>
</html>
