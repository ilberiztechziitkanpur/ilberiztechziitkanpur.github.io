<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 250" width="340" height="250" font-family="Times New Roman, serif" font-size="22" text-anchor="middle" fill="#000">
  <rect width="340" height="250" fill="#fff"/>
  <g stroke="#000" stroke-width="2">
    <!-- main chain C1-C2-C3-C4 at y=100 -->
    <line x1="48" y1="93" x2="68" y2="93"/>
    <line x1="92" y1="93" x2="128" y2="93"/>
    <line x1="152" y1="93" x2="188" y2="93"/>
    <line x1="212" y1="93" x2="248" y2="93"/>
    <line x1="272" y1="93" x2="292" y2="93"/>
    <!-- verticals up -->
    <line x1="80" y1="62" x2="80" y2="78"/>
    <line x1="140" y1="62" x2="140" y2="78"/>
    <line x1="200" y1="62" x2="200" y2="78"/>
    <line x1="260" y1="62" x2="260" y2="78"/>
    <!-- verticals down -->
    <line x1="80" y1="106" x2="80" y2="122"/>
    <line x1="140" y1="106" x2="140" y2="146"/>
    <line x1="200" y1="106" x2="200" y2="122"/>
    <line x1="260" y1="106" x2="260" y2="122"/>
    <!-- branch carbon -->
    <line x1="116" y1="163" x2="128" y2="163"/>
    <line x1="152" y1="163" x2="164" y2="163"/>
    <line x1="140" y1="176" x2="140" y2="192"/>
  </g>
  <text x="36" y="101">H</text>
  <text x="80" y="101">C</text><text x="140" y="101">C</text><text x="200" y="101">C</text><text x="260" y="101">C</text>
  <text x="304" y="101">H</text>
  <text x="80" y="58">H</text><text x="140" y="58">H</text><text x="200" y="58">H</text><text x="260" y="58">H</text>
  <text x="80" y="142">H</text><text x="200" y="142">H</text><text x="260" y="142">H</text>
  <text x="140" y="171">C</text>
  <text x="104" y="171">H</text><text x="176" y="171">H</text>
  <text x="140" y="212">H</text>
  <text x="170" y="240" font-size="15" font-family="Arial, sans-serif">2-methylbutane</text>
