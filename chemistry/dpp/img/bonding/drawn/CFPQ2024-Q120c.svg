<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 120" width="300" height="120" font-family="Times New Roman, serif" fill="#000">
  <rect width="300" height="120" fill="#fff"/>
  <!-- [M]2+ -->
  <text x="20" y="72" font-size="40">[</text>
  <text x="36" y="72" font-size="34">M</text>
  <text x="70" y="72" font-size="40">]</text>
  <text x="82" y="50" font-size="18">2+</text>
  <!-- [ L with octet ]2- -->
  <text x="130" y="76" font-size="48">[</text>
  <text x="182" y="72" font-size="34">L</text>
  <!-- top pair -->
  <circle cx="186" cy="34" r="3"/><circle cx="198" cy="34" r="3"/>
  <!-- bottom pair -->
  <circle cx="186" cy="86" r="3"/><circle cx="198" cy="86" r="3"/>
  <!-- right pair -->
  <circle cx="214" cy="54" r="3"/><circle cx="214" cy="66" r="3"/>
  <!-- left pair: the two electrons received from M -->
  <text x="160" y="58" font-size="14">×</text>
  <text x="160" y="72" font-size="14">×</text>
  <text x="224" y="76" font-size="48">]</text>
  <text x="240" y="44" font-size="18">2–</text>
  <text x="150" y="112" font-size="12" font-family="Arial, sans-serif" fill="#000">• electrons of L   × electrons from M</text>
</svg>
