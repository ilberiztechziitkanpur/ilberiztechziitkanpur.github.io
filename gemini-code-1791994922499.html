<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ICSE 2027 Geography — Master 100 MCQ DPP & 8-Year DNA Engine | Ilberiz Techz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-2: #273549;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-dark: #0284c7;
      --correct: #22c55e;
      --correct-bg: rgba(34, 197, 94, 0.14);
      --wrong: #ef4444;
      --wrong-bg: rgba(239, 68, 68, 0.14);
      --warn: #f59e0b;
      --warn-bg: rgba(245, 158, 11, 0.15);
      --purple: #a855f7;
      --purple-bg: rgba(168, 85, 247, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.55;
      padding-bottom: 80px;
    }

    /* Sticky Top Header & Timer Bar */
    .top-bar {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .top-bar-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .home-nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      color: var(--text);
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 600;
      padding: 5px 11px;
      border-radius: 6px;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .home-nav-btn:hover {
      background: rgba(56, 189, 248, 0.16);
      border-color: var(--accent);
      color: var(--accent);
      transform: translateX(-2px);
    }

    .brand-badge {
      background: linear-gradient(135deg, #0284c7, #6366f1);
      color: #fff;
      font-weight: 800;
      font-size: 0.78rem;
      padding: 4px 10px;
      border-radius: 6px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .brand-title h1 {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text);
    }

    .timer-cluster {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .timer-display {
      font-family: 'Courier New', monospace;
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--accent);
      min-width: 72px;
      text-align: center;
    }

    .timer-display.urgent {
      color: var(--wrong);
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .btn {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn:hover {
      background: #334155;
      border-color: var(--accent);
    }

    .btn-primary {
      background: var(--accent-dark);
      border-color: var(--accent);
      color: #fff;
    }

    .btn-primary:hover {
      background: #0369a1;
    }

    .btn-success {
      background: #15803d;
      border-color: var(--correct);
      color: #fff;
    }

    .btn-danger {
      background: #b91c1c;
      border-color: var(--wrong);
      color: #fff;
    }

    .stats-cluster {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 0.85rem;
    }

    .stat-pill {
      background: var(--surface);
      padding: 5px 11px;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-weight: 600;
    }

    .stat-pill span {
      font-weight: 800;
      color: var(--accent);
    }

    /* Main Container */
    .container {
      max-width: 1200px;
      margin: 22px auto;
      padding: 0 18px;
    }

    /* Control & Filter Panel */
    .control-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 22px;
    }

    .control-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
      margin-bottom: 14px;
    }

    .control-group label {
      display: block;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
      margin-bottom: 6px;
      font-weight: 700;
    }

    select, input[type="text"] {
      width: 100%;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 11px;
      border-radius: 6px;
      font-size: 0.88rem;
    }

    .action-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }

    /* Score Report Dashboard (Hidden until Submit or Toggle) */
    .report-card {
      display: none;
      background: linear-gradient(145deg, #1e293b, #0f172a);
      border: 2px solid var(--accent);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
    }

    .report-card.active {
      display: block;
    }

    .report-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .unit-breakdown {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 10px;
    }

    .unit-stat-box {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
    }

    .unit-stat-box strong {
      display: block;
      margin-bottom: 4px;
      color: var(--accent);
    }

    /* Question Cards */
    .question-list {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .q-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      transition: border-color 0.2s ease;
    }

    .q-card.answered-correct {
      border-left: 5px solid var(--correct);
    }

    .q-card.answered-wrong {
      border-left: 5px solid var(--wrong);
    }

    .q-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
    }

    .badge-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .q-num {
      background: var(--bg);
      color: var(--accent);
      font-weight: 800;
      font-size: 0.85rem;
      padding: 3px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    .badge {
      font-size: 0.74rem;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 5px;
      letter-spacing: 0.2px;
    }

    .badge-unit {
      background: rgba(56, 189, 248, 0.14);
      color: #7dd3fc;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .badge-board {
      background: var(--purple-bg);
      color: #d8b4fe;
      border: 1px solid rgba(168, 85, 247, 0.35);
    }

    .badge-freq {
      background: var(--warn-bg);
      color: #fcd34d;
      border: 1px solid rgba(245, 158, 11, 0.35);
    }

    .badge-prob {
      background: rgba(34, 197, 94, 0.15);
      color: #86efac;
      border: 1px solid rgba(34, 197, 94, 0.35);
    }

    .bookmark-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.78rem;
      cursor: pointer;
    }

    .bookmark-btn.active {
      background: var(--warn-bg);
      color: #fcd34d;
      border-color: var(--warn);
    }

    .q-stem {
      font-size: 1.02rem;
      font-weight: 600;
      margin-bottom: 14px;
      color: #f1f5f9;
      white-space: pre-line;
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 10px;
    }

    .opt-btn {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      width: 100%;
      text-align: left;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 11px 14px;
      border-radius: 8px;
      font-size: 0.92rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .opt-btn:hover:not(:disabled) {
      border-color: var(--accent);
      background: rgba(56, 189, 248, 0.07);
    }

    .opt-letter {
      font-weight: 800;
      color: var(--accent);
      min-width: 22px;
    }

    /* Option States */
    .opt-btn.selected-exam {
      border-color: var(--accent);
      background: rgba(56, 189, 248, 0.18);
    }

    .opt-btn.correct-reveal {
      border-color: var(--correct);
      background: var(--correct-bg);
      color: #dcfce7;
      font-weight: 600;
    }

    .opt-btn.wrong-reveal {
      border-color: var(--wrong);
      background: var(--wrong-bg);
      color: #fee2e2;
    }

    /* DNA & Pattern Explanation Box */
    .dna-box {
      display: none;
      margin-top: 14px;
      padding: 14px 16px;
      background: rgba(15, 23, 42, 0.75);
      border-left: 4px solid var(--accent);
      border-radius: 6px;
      font-size: 0.88rem;
    }

    .dna-box.visible {
      display: block;
    }

    .dna-title {
      font-weight: 800;
      color: var(--accent);
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dna-text {
      color: #cbd5e1;
    }

    @media print {
      .top-bar, .control-panel, .bookmark-btn {
        display: none !important;
      }
      body {
        background: #fff;
        color: #000;
      }
      .q-card {
        break-inside: avoid;
        border: 1px solid #ccc;
        background: #fff;
        color: #000;
      }
      .q-stem, .opt-btn, .dna-text {
        color: #000 !important;
      }
    }
  </style>
</head>

  <!-- STICKY HEADER WITH DPP TIMER & LIVE SCORE -->
  <header class="top-bar">
    <div class="top-bar-inner">

  <main class="container">

      </div>

      <div class="action-row">
        <div style="font-size:0.84rem; color:var(--muted);">

        </div>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <button class="btn btn-success" onclick="submitDPP()">Submit DPP & View Full Report</button>
          <button class="btn" onclick="toggleAllDNA()">Toggle All DNA & Answers (Revision Mode)</button>
          <button class="btn btn-danger" onclick="resetAllAttempts()">Reset All Attempts</button>
          <button class="btn" onclick="window.print()">Print / Save PDF</button>
        </div>
      </div>
    </section>

    <!-- DIAGNOSTIC REPORT CARD -->
    <section id="reportCard" class="report-card">

        <div>
          <h2 style="color:var(--accent); font-size:1.3rem;">DPP Performance & Chapter-Wise DNA Diagnostic</h2>
          <p id="reportSummaryText" style="color:var(--muted); font-size:0.9rem; margin-top:4px;"></p>

      <div id="unitBreakdownGrid" class="unit-breakdown"></div>

    <!-- QUESTIONS CONTAINER -->
    <section id="questionContainer" class="question-list"></section>
  </main>

          "It burns all plastic waste in the open air",

          "It does not require waste segregation"
        ],
        ans: 1,
        dna: "Correct Answer: (b). PATTERN DNA: Sanitary Landfill vs. Open Dumping has been asked 7 times in 8 years. Two key features: (1) Clay/plastic bottom liner stops leachate percolation into groundwater; (2) Daily soil cover prevents foul odour and disease vectors."

    // ============================================================================
    // APPLICATION STATE & PERSISTENCE
    // ============================================================================
    let userAnswers = {};      // { qId: selectedIndex }
    let bookmarks = new Set(); // Set of bookmarked qIds
    let examSubmitted = false;
    let showAllDNA = false;

    // Timer state
    let timerSeconds = 30 * 60;
    let timerRunning = false;
    let timerInterval = null;

    // Load saved progress from localStorage if available
    function loadSavedState() {
      try {
        const savedAns = localStorage.getItem("icse2027_geo_ans");
        const savedBm = localStorage.getItem("icse2027_geo_bm");
        if (savedAns) userAnswers = JSON.parse(savedAns);
        if (savedBm) bookmarks = new Set(JSON.parse(savedBm));
      } catch (e) {}
    }

    function saveState() {
      try {
        localStorage.setItem("icse2027_geo_ans", JSON.stringify(userAnswers));
        localStorage.setItem("icse2027_geo_bm", JSON.stringify(Array.from(bookmarks)));
      } catch (e) {}
    }

    // ============================================================================
    // TIMER FUNCTIONS
    // ============================================================================
    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return String(m).padStart(2, '0') + ":" + String(s).padStart(2, '0');
    }

    function updateTimerUI() {
      const disp = document.getElementById("timerDisplay");
      disp.textContent = formatTime(timerSeconds);
      if (timerSeconds <= 180 && timerRunning) {
        disp.classList.add("urgent");
      } else {
        disp.classList.remove("urgent");
      }
    }

    function toggleTimer() {
      const btn = document.getElementById("startPauseBtn");
      if (timerRunning) {
        clearInterval(timerInterval);
        timerRunning = false;
        btn.textContent = "Resume";
      } else {
        timerRunning = true;
        btn.textContent = "Pause";
        timerInterval = setInterval(() => {
          if (timerSeconds > 0) {
            timerSeconds--;
            updateTimerUI();
          } else {
            clearInterval(timerInterval);
            timerRunning = false;
            btn.textContent = "Start";
            alert("Time's up! Submitting your DPP for evaluation.");
            submitDPP();
          }
        }, 1000);
      }
    }

    function resetTimer() {
      clearInterval(timerInterval);
      timerRunning = false;
      document.getElementById("startPauseBtn").textContent = "Start";
      const mins = parseInt(document.getElementById("timerPreset").value, 10);
      timerSeconds = mins * 60;
      updateTimerUI();
    }

    function changeTimerPreset() {
      resetTimer();
    }

    // ============================================================================
    // FILTERING & RENDERING
    // ============================================================================
    function getFilteredQuestions() {
      const unitVal = document.getElementById("unitFilter").value;
      const srcVal = document.getElementById("sourceFilter").value;
      const query = document.getElementById("searchBox").value.trim().toLowerCase();

      return mcqData.filter(item => {
        if (unitVal !== "ALL" && item.unit !== unitVal) return false;

        if (srcVal === "BOARD" && item.cat !== "BOARD") return false;
        if (srcVal === "SPECIMEN" && item.cat !== "SPECIMEN") return false;
        if (srcVal === "LOCK2027" && item.cat !== "LOCK2027" && item.cat !== "HIGH_REP") return false;
        if (srcVal === "HIGH_REP" && item.repCount < 5) return false;
        if (srcVal === "WRONG") {
          if (userAnswers[item.id] === undefined || userAnswers[item.id] === item.ans) return false;
        }
        if (srcVal === "BOOKMARKED" && !bookmarks.has(item.id)) return false;

        if (query) {
          const hay = (item.q + " " + item.opts.join(" ") + " " + item.dna + " " + item.source).toLowerCase();
          if (!hay.includes(query)) return false;
        }
        return true;
      });
    }

    function renderQuestions() {
      const container = document.getElementById("questionContainer");
      const mode = document.getElementById("modeSelect").value;
      const filtered = getFilteredQuestions();
      document.getElementById("visibleCount").textContent = filtered.length;

      if (filtered.length === 0) {
        container.innerHTML = `<div class="q-card" style="text-align:center; color:var(--muted);">No questions match the current filter. Try switching the filter above.</div>`;
        updateLiveStats();
        return;
      }

      const letters = ["(a)", "(b)", "(c)", "(d)"];

      container.innerHTML = filtered.map(item => {
        const chosen = userAnswers[item.id];
        const isAnswered = chosen !== undefined;
        const isCorrect = chosen === item.ans;
        const shouldReveal = showAllDNA || (mode === "instant" && isAnswered) || (mode === "exam" && examSubmitted && isAnswered);

        let cardClass = "q-card";
        if (shouldReveal && isAnswered) {
          cardClass += isCorrect ? " answered-correct" : " answered-wrong";
        }

        const optionsHTML = item.opts.map((optText, idx) => {
          let btnClass = "opt-btn";
          if (mode === "exam" && !examSubmitted && !showAllDNA) {
            if (chosen === idx) btnClass += " selected-exam";
          } else if (shouldReveal) {
            if (idx === item.ans) btnClass += " correct-reveal";
            else if (chosen === idx && chosen !== item.ans) btnClass += " wrong-reveal";
          }

          return `
            <button class="${btnClass}" onclick="selectOption(${item.id}, ${idx})">
              <span class="opt-letter">${letters[idx]}</span>
              <span>${optText}</span>
            </button>
          `;
        }).join("");

        const isBm = bookmarks.has(item.id);

        return `
          <article class="${cardClass}" id="qcard-${item.id}">
            <div class="q-meta">
              <div class="badge-row">
                <span class="q-num">Q${item.id}</span>
                <span class="badge badge-unit">${item.unit}</span>
                <span class="badge badge-board">${item.source}</span>
                <span class="badge badge-freq">${item.freqBadge}</span>
                <span class="badge badge-prob">${item.prob}</span>
              </div>
              <button class="bookmark-btn ${isBm ? 'active' : ''}" onclick="toggleBookmark(${item.id})">
                ${isBm ? '★ Starred' : '☆ Star for Revision'}
              </button>
            </div>

            <div class="q-stem">${item.q}</div>

            <div class="options-grid">
              ${optionsHTML}
            </div>

            <div class="dna-box ${shouldReveal ? 'visible' : ''}">
              <div class="dna-title">
                <span>8-Year CISCE Pattern DNA & Examiner Key</span>
              </div>
              <div class="dna-text">${item.dna}</div>
            </div>
          </article>
        `;
      }).join("");

      updateLiveStats();
    }

    // ============================================================================
    // INTERACTION HANDLERS
    // ============================================================================
    function selectOption(qId, optIdx) {
      userAnswers[qId] = optIdx;
      saveState();
      renderQuestions();
    }

    function toggleBookmark(qId) {
      if (bookmarks.has(qId)) bookmarks.delete(qId);
      else bookmarks.add(qId);
      saveState();
      renderQuestions();
    }

    function handleModeChange() {
      examSubmitted = false;
      document.getElementById("reportCard").classList.remove("active");
      renderQuestions();
    }

    function toggleAllDNA() {
      showAllDNA = !showAllDNA;
      renderQuestions();
    }

    function resetAllAttempts() {
      if (!confirm("Reset all your selected answers and start fresh?")) return;
      userAnswers = {};
      examSubmitted = false;
      showAllDNA = false;
      saveState();
      document.getElementById("reportCard").classList.remove("active");
      renderQuestions();
    }

    function updateLiveStats() {
      const mode = document.getElementById("modeSelect").value;
      const attemptedIds = Object.keys(userAnswers).map(Number);
      const totalAttempted = attemptedIds.length;
      let correctCount = 0;

      attemptedIds.forEach(id => {
        const qObj = mcqData.find(x => x.id === id);
        if (qObj && userAnswers[id] === qObj.ans) correctCount++;
      });

      document.getElementById("statAttempted").textContent = `${totalAttempted}/100`;

      if (mode === "exam" && !examSubmitted) {
        document.getElementById("statCorrect").textContent = "Hidden";
        document.getElementById("statAccuracy").textContent = "Hidden";
      } else {
        const acc = totalAttempted > 0 ? Math.round((correctCount / totalAttempted) * 100) : 0;
        document.getElementById("statCorrect").textContent = `${correctCount}`;
        document.getElementById("statAccuracy").textContent = `${acc}%`;
      }
    }

    function submitDPP() {
      examSubmitted = true;
      if (timerRunning) toggleTimer();
      renderQuestions();

      // Build diagnostic breakdown per unit
      const units = [
        "Climate of India",
        "Soil Resources",
        "Natural Vegetation",
        "Water Resources",
        "Minerals & Energy",
        "Agriculture",
        "Manufacturing Industries",
        "Transport",
        "Waste Management"
      ];

      let totalCorrect = 0;
      let totalAns = Object.keys(userAnswers).length;

      const gridHTML = units.map(u => {
        const qs = mcqData.filter(x => x.unit === u);
        let uAtt = 0;
        let uCor = 0;
        qs.forEach(q => {
          if (userAnswers[q.id] !== undefined) {
            uAtt++;
            if (userAnswers[q.id] === q.ans) {
              uCor++;
              totalCorrect++;
            }
          }
        });
        const pct = uAtt > 0 ? Math.round((uCor / uAtt) * 100) : 0;
        return `
          <div class="unit-stat-box">
            <strong>${u}</strong>
            <div>Score: <b>${uCor} / ${qs.length}</b> (Attempted: ${uAtt})</div>
            <div style="color:${pct >= 85 ? 'var(--correct)' : pct >= 60 ? 'var(--warn)' : 'var(--wrong)'}; font-weight:700;">
              Unit Accuracy: ${pct}%
            </div>
          </div>
        `;
      }).join("");

      const overallAcc = totalAns > 0 ? Math.round((totalCorrect / totalAns) * 100) : 0;
      document.getElementById("reportSummaryText").innerHTML =
        `Total Score: <strong>${totalCorrect} / 100</strong> | Attempted: <strong>${totalAns}</strong> | Accuracy: <strong>${overallAcc}%</strong>. Scroll down to review the 8-Year DNA explanations for any wrong answers, or select <em>"My Mistakes Only"</em> in Filter 3 to re-test them!`;
      document.getElementById("unitBreakdownGrid").innerHTML = gridHTML;
      const rc = document.getElementById("reportCard");
      rc.classList.add("active");
      rc.scrollIntoView({ behavior: "smooth" });
    }

    function applyUrlParams() {
      try {
        const params = new URLSearchParams(window.location.search);
        const unitParam = params.get('unit');
        if (unitParam) {
          const unitSelect = document.getElementById('unitFilter');
          if (unitSelect) {
            for (let opt of unitSelect.options) {
              if (opt.value.toLowerCase() === unitParam.toLowerCase() || opt.text.toLowerCase().includes(unitParam.toLowerCase())) {
                unitSelect.value = opt.value;
                break;
              }
            }
          }
        }
        const modeParam = params.get('mode');
        if (modeParam && document.getElementById('modeSelect')) {
          document.getElementById('modeSelect').value = modeParam;
        }
        const sourceParam = params.get('source');
        if (sourceParam && document.getElementById('sourceFilter')) {
          document.getElementById('sourceFilter').value = sourceParam;
        }
      } catch (e) {
        console.warn('URL params parsing error:', e);
      }
    }

    // Initialize on load
    loadSavedState();
    applyUrlParams();
    updateTimerUI();
    renderQuestions();
  </script>
</body>
